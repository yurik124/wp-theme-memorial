name: Проверки

# На каждый push и pull request — быстрые проверки (около 2 минут):
#   PHP: синтаксис на 8.1 и 8.4, префиксы, дымовые тесты, WPCS для нового кода, совместимость PHP;
#   JS/CSS: ESLint, Stylelint, JSON-схемы, сборка.
# Проверка в WordPress 7.1.4 (wp-env + Playwright, около 10 минут) — только:
#   — перед каждой выгрузкой на сайт (deploy.yml вызывает этот workflow);
#   — по кнопке: Actions → «Проверки» → Run workflow (галочка «Проверить в WordPress»).

on:
  push:
    branches: [main, block-migration, 'stage-*']
  pull_request:
  workflow_dispatch:
    inputs:
      wordpress:
        description: Проверить в WordPress 7.1.4 (wp-env, около 10 минут)
        type: boolean
        default: true
  workflow_call:
    inputs:
      wordpress:
        type: boolean
        default: true

# Свой workflow в группе: проверки перед выгрузкой не отменяют обычные и наоборот.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, cs2pr
          coverage: none

      - name: Синтаксис PHP
        run: |
          find memorial-plugin memorial-theme tools tests -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Префиксы и вызовы (tools/check-prefixes.php)
        if: ${{ !cancelled() }}
        run: php tools/check-prefixes.php

      - name: block.json блоков плагина совпадают с их описаниями в PHP (tools/block-json.php check)
        if: ${{ !cancelled() }}
        run: php tools/block-json.php check

      - name: Переводы (tools/i18n.php check)
        if: ${{ !cancelled() }}
        run: php tools/i18n.php check

      - name: Дымовые тесты без WordPress
        if: ${{ !cancelled() }}
        run: |
          php tests/smoke/switch.php
          php tests/smoke/metrika.php
          php tests/smoke/settings.php
          php tests/smoke/seo.php
          php tools/check-templates.php

      - name: Сжатые копии CSS/JS свежие (tools/minify.php)
        if: ${{ !cancelled() }}
        run: |
          for min in $(git ls-files 'memorial-theme/assets/*.min.css' 'memorial-theme/assets/*.min.js' 'memorial-plugin/assets/*.min.css' 'memorial-plugin/assets/*.min.js'); do
            src="${min%.min.*}.${min##*.}"
            [ -f "$src" ] && php tools/minify.php "$src" > /dev/null
          done
          git diff --exit-code --stat -- '*.min.css' '*.min.js' || { echo "::error::Сжатые копии устарели: php tools/minify.php <исходник>"; exit 1; }

      - name: Composer (инструменты)
        if: ${{ !cancelled() && matrix.php == '8.4' }}
        run: composer install --no-interaction --no-progress

      # Полный отчёт — в журнале шага, замечания — ещё и аннотациями к строкам (cs2pr).
      - name: WPCS — весь код плагина
        if: ${{ !cancelled() && matrix.php == '8.4' }}
        run: |
          vendor/bin/phpcs --standard=memorial-plugin/phpcs.xml.dist --report-full --report-checkstyle=phpcs-plugin.xml && s=0 || s=$?
          cs2pr --graceful-warnings phpcs-plugin.xml || true
          exit $s

      - name: Совместимость с PHP 8.1+ — весь код
        if: ${{ !cancelled() && matrix.php == '8.4' }}
        run: |
          vendor/bin/phpcs --standard=phpcs-compat.xml.dist --report-full --report-checkstyle=phpcs-compat.xml && s=0 || s=$?
          cs2pr --graceful-warnings phpcs-compat.xml || true
          exit $s

      - name: WPCS — тема
        if: ${{ !cancelled() && matrix.php == '8.4' }}
        run: |
          vendor/bin/phpcs --standard=memorial-theme/phpcs.xml.dist --report-full --report-checkstyle=phpcs-theme.xml && s=0 || s=$?
          cs2pr --graceful-warnings phpcs-theme.xml || true
          exit $s

      - name: Автозагрузка плагина (classmap)
        if: ${{ !cancelled() && matrix.php == '8.4' }}
        run: composer dump-autoload --working-dir=memorial-plugin --no-dev --classmap-authoritative

  js:
    name: JS, CSS, сборка
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Пока package-lock.json нет в репозитории, npm install создаёт его — сохраняем артефактом, чтобы закоммитить.
      - name: Есть ли файл блокировки версий
        id: lock
        run: echo "missing=$([ -f package-lock.json ] && echo no || echo yes)" >> "$GITHUB_OUTPUT"

      - name: Зависимости
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Файл блокировки версий (если его ещё нет в репозитории)
        if: steps.lock.outputs.missing == 'yes'
        uses: actions/upload-artifact@v5
        with:
          name: package-lock
          path: package-lock.json

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint:js

      - name: Stylelint
        if: ${{ !cancelled() }}
        run: npm run lint:css

      - name: JSON-схемы (theme.json, block.json)
        if: ${{ !cancelled() }}
        run: npm run lint:json

      - name: Сборка
        if: ${{ !cancelled() }}
        run: npm run build

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: plugin-build
          path: memorial-plugin/build

  # Проверки на WordPress делятся на две части, у каждой — свой WordPress в Docker и один браузер:
  # меньше нагрузки на раннер и быстрее в сумме.
  wordpress:
    name: WordPress 7.1.4 (wp-env), часть ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    needs: [php, js]
    if: ${{ inputs.wordpress }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Зависимости
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Сборка
        run: npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Автозагрузка плагина
        run: composer dump-autoload --working-dir=memorial-plugin --no-dev --classmap-authoritative

      # PHPUnit (логика, REST, способности) — в части 1: окружение тестов wp-env и PHPUnit из composer плагина
      - name: PHPUnit — подготовка
        if: ${{ matrix.shard == 1 }}
        run: |
          echo '{"testsEnvironment": true}' > .wp-env.override.json
          composer install --working-dir=memorial-plugin --no-interaction --no-progress

      - name: Запуск WordPress
        run: |
          npx wp-env start --debug
          # «Оформление» как на сайте со своей схемой: проверка переноса в стили сайта (tests/e2e/site.spec.js)
          npx wp-env run cli wp option update mem_design '{"colors":{"preset":"stone"},"text":{"scale":"110","head":"100"}}' --format=json
          npx wp-env run cli wp theme activate memorial-theme
          # Страница со всеми блоками плагина: проверка, что каждый выводится без ошибок (tests/e2e/blocks.spec.js)
          npx wp-env run cli wp eval-file wp-content/plugins/memorial-plugin/tools/create-blocks-check-page.php
          npx wp-env run cli wp plugin list
          npx wp-env run cli wp core version

      - name: Переводы — сверка с WP-CLI (wp i18n make-pot)
        if: ${{ matrix.shard == 1 }}
        run: |
          npx wp-env run cli wp i18n make-pot wp-content/plugins/memorial-plugin wp-content/plugins/memorial-plugin/cli.pot --domain=memorial-plugin --exclude=vendor,build,tests,node_modules,languages
          npx wp-env run cli wp i18n make-pot wp-content/themes/memorial-theme wp-content/themes/memorial-theme/cli.pot --domain=memorial-theme --exclude=languages
          php tools/i18n.php compare memorial-plugin memorial-plugin/cli.pot
          php tools/i18n.php compare memorial-theme memorial-theme/cli.pot
          rm -f memorial-plugin/cli.pot memorial-theme/cli.pot

      - name: PHPUnit
        if: ${{ matrix.shard == 1 }}
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/memorial-plugin vendor/bin/phpunit

      - name: Браузер для проверок
        run: npx playwright install --with-deps chromium || npx playwright install chromium  # зеркала apt бывают недоступны: в образе раннера библиотеки браузера уже есть

      - name: Проверки в браузере, часть ${{ matrix.shard }}/2
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      - name: Ошибки PHP в debug.log
        if: always()
        run: |
          npx wp-env run cli sh -c 'cat wp-content/debug.log 2>/dev/null || true' > artifacts-debug.log
          echo "---- журналы переносов ----"
          npx wp-env run cli sh -c 'for o in memorial_theme_design_migrated memorial_theme_nav_migrated memorial_plugin_switchover; do echo "$o: $(wp option get $o --format=json 2>/dev/null)"; done' || true
          npx wp-env run cli wp eval 'echo "global styles post: ", WP_Theme_JSON_Resolver::get_user_global_styles_post_id(), "\n"; echo substr( wp_get_global_stylesheet( array( "variables" ) ), 0, 400 ), "\n";' || true
          echo "---- debug.log (до 200 строк) ----"; head -n 200 artifacts-debug.log
          if grep -E "PHP (Fatal error|Parse error)|Uncaught" artifacts-debug.log; then
            echo "::error::В debug.log есть фатальные ошибки PHP"; exit 1
          fi
          if grep -E "PHP (Warning|Notice|Deprecated)" artifacts-debug.log | grep -E "memorial-(plugin|theme)" ; then
            echo "::error::Предупреждения PHP в коде темы/плагина — см. журнал выше"; exit 1
          fi
          if grep -E "_load_textdomain_just_in_time|memorial-(plugin|theme)</code> domain was triggered too early" artifacts-debug.log ; then
            echo "::error::Переводы плагина или темы загружаются слишком рано (до init)"; exit 1
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: wordpress-checks-${{ matrix.shard }}
          if-no-files-found: ignore
          path: |
            artifacts
            artifacts-debug.log
