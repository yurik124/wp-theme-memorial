name: Деплой на сайт

# Выгрузка темы и плагина на хостинг по SFTP (lftp).
#  1. Сборка: npm run build (JS плагина) и composer dump-autoload (автозагрузка классов плагина).
#  2. В пакет попадает только то, что нужно сайту: без src/, node_modules/, тестов и конфигов разработки.
#  3. Выгрузка во временную папку (.memorial-plugin-new), затем переименование одной операцией:
#     сайт не видит полузалитый плагин. Прежняя версия на время подмены — .memorial-plugin-old, после подмены удаляется.
#  Откат — из резервной копии сайта (UpdraftPlus), см. MIGRATION.md.
#
# Перед выгрузкой — все проверки, включая WordPress 7.1.4 (ci.yml). Не прошли — выгрузки нет.
# После выгрузки — проверка микроразметки на самом сайте (задача «Микроразметка на сайте»): страницы из карты
# сайта запрашиваются с хостинга по SSH (адреса GitHub хостинг не пускает), отчёт — в артефакте schema-site.
# Запуск: push в main или вручную (Actions → «Деплой на сайт» → Run workflow → выбрать ветку).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:            # две выгрузки одновременно не пойдут
  group: deploy
  cancel-in-progress: false

env:
  SFTP_HOST: ${{ secrets.SFTP_HOST }}
  SFTP_PORT: ${{ secrets.SFTP_PORT }}
  SFTP_USER: ${{ secrets.SFTP_USER }}
  SITE_DIR: ${{ secrets.SITE_DIR }}

permissions:
  contents: read

jobs:
  checks:
    name: Проверки перед выгрузкой
    uses: ./.github/workflows/ci.yml
    with:
      wordpress: true

  deploy:
    needs: [checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Сборка
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build
          composer dump-autoload --working-dir=memorial-plugin --no-dev --classmap-authoritative

      - name: Пакет для сайта
        run: |
          mkdir -p dist
          rsync -a --delete \
            --exclude 'src/' --exclude 'node_modules/' --exclude 'tests/' --exclude 'tools/' \
            --exclude 'phpcs.xml.dist' --exclude 'phpunit.xml.dist' --exclude '*.lock' --exclude '*.tmp' --exclude '.*' \
            memorial-plugin/ dist/memorial-plugin/
          rsync -a --delete \
            --exclude 'src/' --exclude 'node_modules/' --exclude 'tests/' --exclude 'tools/' \
            --exclude 'phpcs.xml.dist' --exclude 'phpunit.xml.dist' --exclude '*.lock' --exclude '*.tmp' --exclude '.*' \
            memorial-theme/ dist/memorial-theme/
          test -f dist/memorial-plugin/memorial-plugin.php
          test -f dist/memorial-plugin/vendor/autoload.php
          test -f dist/memorial-theme/style.css
          du -sh dist/*

      # вход на хостинг по ключу SSH (секрет SSH_PRIVATE_KEY); без ключа — по паролю, как раньше
      - name: Ключ SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/memorial_key && chmod 600 ~/.ssh/memorial_key
            echo "SSH_KEY_FILE=$HOME/.ssh/memorial_key" >> "$GITHUB_ENV"
            echo "LFTP_OPEN=set sftp:connect-program \"ssh -a -x -i $HOME/.ssh/memorial_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes\"; open -u $SFTP_USER," >> "$GITHUB_ENV"
            echo "Вход по ключу"
          else
            echo "LFTP_OPEN=open -u $SFTP_USER --env-password" >> "$GITHUB_ENV"
            echo "::warning::Секрета SSH_PRIVATE_KEY нет — вход по паролю"
          fi

      - name: Установить lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Выгрузить во временные папки
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; set cmd:fail-exit yes;
            $LFTP_OPEN sftp://$SFTP_HOST:$SFTP_PORT;
            mirror --reverse --delete --parallel=4 --verbose ./dist/memorial-theme/ $SITE_DIR/themes/.memorial-theme-new/;
            mirror --reverse --delete --parallel=4 --verbose ./dist/memorial-plugin/ $SITE_DIR/plugins/.memorial-plugin-new/;
          "

      - name: Подменить папки
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          for kind in themes:memorial-theme plugins:memorial-plugin; do
            dir=${kind%%:*}; name=${kind##*:}
            # прошлая резервная копия и текущая папка могут отсутствовать (первая выгрузка) — это не ошибка
            lftp -c "
              set sftp:auto-confirm yes; set cmd:fail-exit no;
              $LFTP_OPEN sftp://$SFTP_HOST:$SFTP_PORT;
              rm -r -f $SITE_DIR/$dir/.$name-old;
              mv $SITE_DIR/$dir/$name $SITE_DIR/$dir/.$name-old;
            " || true
            # а вот переименование новой версии обязано пройти
            lftp -c "
              set sftp:auto-confirm yes; set cmd:fail-exit yes;
              $LFTP_OPEN sftp://$SFTP_HOST:$SFTP_PORT;
              mv $SITE_DIR/$dir/.$name-new $SITE_DIR/$dir/$name;
            "
            # прежняя версия больше не нужна
            lftp -c "
              set sftp:auto-confirm yes; set cmd:fail-exit no;
              $LFTP_OPEN sftp://$SFTP_HOST:$SFTP_PORT;
              rm -r -f $SITE_DIR/$dir/.$name-old;
            " || true
          done

  schema:
    name: Микроразметка на сайте
    needs: [deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Ключ SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/memorial_key && chmod 600 ~/.ssh/memorial_key
            echo "SSH_KEY_FILE=$HOME/.ssh/memorial_key" >> "$GITHUB_ENV"
          fi

      - name: Адрес сайта (из последней копии базы UpdraftPlus)
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          pip install -q paramiko requests lxml
          python3 - <<'PY'
          import gzip, os, re, paramiko
          auth = {'pkey': paramiko.PKey.from_path(os.environ['SSH_KEY_FILE'])} if os.environ.get('SSH_KEY_FILE') else {'password': os.environ['SFTP_PASSWORD']}
          t = paramiko.Transport((os.environ['SFTP_HOST'], int(os.environ.get('SFTP_PORT') or 22)))
          t.connect(username=os.environ['SFTP_USER'], **auth)
          sf = paramiko.SFTPClient.from_transport(t)
          site = os.environ['SITE_DIR'].rstrip('/')
          dbs = sorted(f for f in sf.listdir(site + '/updraft') if f.endswith('-db.gz'))
          with sf.open(site + '/updraft/' + dbs[-1], 'rb') as raw, gzip.GzipFile(fileobj=raw) as g:
              for line in g:
                  m = re.search(rb"'home',\s*'([^']+)'", line) or re.search(rb"'siteurl',\s*'([^']+)'", line)
                  if m:
                      open(os.environ['GITHUB_ENV'], 'a').write('SITE_URL=' + m.group(1).decode().rstrip('/') + '\n')
                      break
          PY

      - name: Микроразметка на сайте
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          echo "сайт: $SITE_URL"
          python3 tests/diag/schema_vocab.py build "$(cat tests/diag/schemaorg-version.txt)" schemaorg.json
          python3 tests/diag/fetch_pages.py "$SITE_URL" out/pages --ssh > /dev/null
          python3 tests/diag/schema_check.py out/pages --vocab schemaorg.json --require-vocab --require-og --out out/schema.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: schema-site
          if-no-files-found: ignore
          path: out/schema.json
