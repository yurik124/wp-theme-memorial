name: Деплой на сайт

# Выгрузка темы и плагина на хостинг по SFTP через lftp mirror:
#  — загружаются файлы темы и плагина (после клонирования у всех файлов новая дата, поэтому заливаются все — это быстро);
#  — файлы, которых больше нет в репозитории, удаляются и на хостинге (--delete),
#    поэтому старые файлы не остаются и не мешают;
#  — папки целиком не удаляются, значит плагин не пропадает с сайта посреди выгрузки.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:            # две выгрузки одновременно не пойдут
  group: deploy
  cancel-in-progress: false

env:
  SFTP_HOST: ${{ secrets.SFTP_HOST }}
  SFTP_PORT: ${{ secrets.SFTP_PORT }}
  SFTP_USER: ${{ secrets.SFTP_USER }}
  SITE_DIR: ${{ secrets.SITE_DIR }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Выгрузить тему и плагин
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3; set net:timeout 30;
            open -u $SFTP_USER --env-password sftp://$SFTP_HOST:$SFTP_PORT;
            mirror --reverse --delete --parallel=4 --verbose \
              --exclude-glob '*.lock' --exclude-glob '*.tmp' \
              ./memorial_speshu/ $SITE_DIR/themes/memorial_speshu/;
            mirror --reverse --delete --parallel=4 --verbose \
              --exclude-glob '*.lock' --exclude-glob '*.tmp' \
              ./memorial-core/ $SITE_DIR/plugins/memorial-core/;
          "
