name: Проверка на копии сайта

# Диагностика жалоб на копии тестового сайта: сценарии из tests/probe снимаются дважды —
# на старой теме и плагине (ветка main) и на блочных (ветка, из которой запущено).
# База и uploads скачиваются только для чтения, в репозиторий не попадают.
# Снимки и log.json — в ветку ci-probe одним коммитом. Запуск: push ветки probe/<что угодно>.

on:
  push:
    branches: ['probe/**']

concurrency:
  group: probe
  cancel-in-progress: true

permissions:
  contents: write

env:
  SFTP_HOST: ${{ secrets.SFTP_HOST }}
  SFTP_PORT: ${{ secrets.SFTP_PORT }}
  SFTP_USER: ${{ secrets.SFTP_USER }}
  SITE_DIR: ${{ secrets.SITE_DIR }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Старый код (main)
        uses: actions/checkout@v5
        with:
          ref: main
          path: classic

      - name: Новый код
        uses: actions/checkout@v5
        with:
          path: after

      - name: Код сайта сейчас (block-migration)
        uses: actions/checkout@v5
        with:
          ref: block-migration
          path: before

      - uses: actions/setup-node@v5
        with:
          node-version-file: after/.nvmrc

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Сборка
        run: |
          for d in before after; do
            (cd $d && npm ci --no-audit --no-fund && npm run build && composer dump-autoload --working-dir=memorial-plugin --no-dev --classmap-authoritative)
          done

      - name: Скачать базу и uploads (только чтение)
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          # paramiko из PyPI, а не lftp из apt: зеркала apt на раннерах бывают недоступны
          pip install -q paramiko
          mkdir -p data uploads
          python3 - <<'PY'
          import os, re, stat, gzip, shutil, paramiko
          t = paramiko.Transport((os.environ['SFTP_HOST'], int(os.environ.get('SFTP_PORT') or 22)))
          t.connect(username=os.environ['SFTP_USER'], password=os.environ['SFTP_PASSWORD'])
          sf = paramiko.SFTPClient.from_transport(t)
          site = os.environ['SITE_DIR'].rstrip('/')
          dbs = sorted(f for f in sf.listdir(site + '/updraft') if f.endswith('-db.gz'))
          sf.get(site + '/updraft/' + dbs[-1], 'data/db.sql.gz')
          with gzip.open('data/db.sql.gz', 'rb') as a, open('data/db.sql', 'wb') as b:
              shutil.copyfileobj(a, b)
          # список файлов — одним соединением, скачивание — в 12 потоков (по своему соединению на поток)
          files = []
          def walk(remote, local):
              os.makedirs(local, exist_ok=True)
              for e in sf.listdir_attr(remote):
                  if e.filename == 'cache' or e.filename.startswith('updraft') or e.filename.endswith('.zip'):
                      continue
                  r, l = remote + '/' + e.filename, os.path.join(local, e.filename)
                  if stat.S_ISDIR(e.st_mode):
                      walk(r, l)
                  else:
                      files.append((r, l))
          # картинки для разбора меню, редактора и админки не нужны — берём только файлы до 2 уровня (логотипы, иконки)
          if os.environ.get('PROBE_UPLOADS') == '1':
              walk(site + '/uploads', 'uploads')
          print(len(files), 'файлов')
          import threading, queue
          q = queue.Queue()
          for f in files: q.put(f)
          def worker():
              tt = paramiko.Transport((os.environ['SFTP_HOST'], int(os.environ.get('SFTP_PORT') or 22)))
              tt.connect(username=os.environ['SFTP_USER'], password=os.environ['SFTP_PASSWORD'])
              c = paramiko.SFTPClient.from_transport(tt)
              while True:
                  try: r, l = q.get_nowait()
                  except queue.Empty: break
                  try: c.get(r, l)
                  except Exception as ex: print('пропуск', r, ex)
              tt.close()
          ts = [threading.Thread(target=worker) for _ in range(12)]
          for t_ in ts: t_.start()
          for t_ in ts: t_.join()
          PY
          du -sh data uploads

      - name: WordPress со старыми темой и плагином
        run: |
          mkdir -p env
          cat > env/.wp-env.json <<'JSON'
          {
            "testsEnvironment": false,
            "core": "https://wordpress.org/wordpress-7.1.4.zip",
            "phpVersion": "8.4",
            "plugins": [],
            "themes": [],
            "mappings": {
              "wp-content/plugins/memorial-core": "../classic/memorial-core",
              "wp-content/themes/memorial_speshu": "../classic/memorial_speshu",
              "wp-content/plugins/memorial-plugin": "../before/memorial-plugin",
              "wp-content/themes/memorial-theme": "../before/memorial-theme",
              "wp-content/uploads": "../uploads",
              "wp-content/ci-data": "../data"
            },
            "config": {
              "WP_DEBUG": true, "WP_DEBUG_LOG": true, "WP_DEBUG_DISPLAY": false,
              "MEMORIAL_PLUGIN_NO_PAGE_CACHE": true, "MEM_NO_PAGE_CACHE": true
            }
          }
          JSON
          cd env
          WPENV=../after/node_modules/.bin/wp-env
          $WPENV start
          $WPENV run cli wp db import wp-content/ci-data/db.sql
          $WPENV run cli sh -c 'wp db query "SELECT option_value FROM $(wp db prefix)options WHERE option_name=\"siteurl\"" --skip-column-names > wp-content/ci-data/siteurl.txt'
          old=$(tr -d '\r\n' < ../data/siteurl.txt)
          $WPENV run cli wp search-replace "$old" "http://localhost:8888" --all-tables --skip-columns=guid --quiet
          $WPENV run cli wp search-replace "${old/https:/http:}" "http://localhost:8888" --all-tables --skip-columns=guid --quiet
          $WPENV run cli sh -c 'wp plugin deactivate memorial-plugin --quiet 2>/dev/null; wp plugin activate memorial-core; wp theme activate memorial_speshu; wp rewrite flush; rm -rf wp-content/cache/memorial'
          $WPENV run cli wp user create probe probe@example.com --role=administrator --user_pass=probe-pass-123
          $WPENV run cli sh -c 'wp post list --post_type=page --post_status=publish --fields=ID,post_title,post_name,url --format=json > wp-content/ci-data/pages.json'
          cp ../data/pages.json ../pages.json

      - name: Браузер
        run: cd after && npx playwright install --with-deps chromium || npx playwright install chromium  # зеркала apt бывают недоступны: в образе раннера библиотеки браузера уже есть

      - name: Что снимать (tests/probe/run.env)
        run: |
          if [ -f after/tests/probe/run.env ]; then . after/tests/probe/run.env; fi
          echo "PROBE_GREP=${PROBE_GREP:-бургер-ветка|подменю ПК}" >> "$GITHUB_ENV"
          echo "PROBE_PHASES=${PROBE_PHASES:-}" >> "$GITHUB_ENV"

      - name: Снимки — старое
        if: ${{ !env.PROBE_PHASES || contains(env.PROBE_PHASES, 'classic') }}
        run: cd after && PHASE=classic PAGES_FILE=$GITHUB_WORKSPACE/pages.json PROBE_DIR=$GITHUB_WORKSPACE/probe npx playwright test --config tests/probe/probe.config.js --grep "$PROBE_GREP" || true

      - name: Переключить на блочное — как на сайте сейчас
        run: |
          cd env
          ../after/node_modules/.bin/wp-env run cli sh -c 'wp plugin deactivate memorial-core --quiet; wp plugin activate memorial-plugin; wp theme activate memorial-theme; wp rewrite flush; rm -rf wp-content/cache/memorial; wp eval "wp_set_current_user( (int) ( get_users( array( \"role\" => \"administrator\", \"number\" => 1, \"fields\" => \"ID\" ) )[0] ?? 1 ) ); do_action(\"admin_init\");" || true; echo "тема: $(wp option get stylesheet)"'

      - name: Снимки — как на сайте сейчас
        if: ${{ !env.PROBE_PHASES || contains(env.PROBE_PHASES, 'before') }}
        run: cd after && PHASE=before PAGES_FILE=$GITHUB_WORKSPACE/pages.json PROBE_DIR=$GITHUB_WORKSPACE/probe npx playwright test --config tests/probe/probe.config.js --grep "$PROBE_GREP" || true

      - name: Переключить на исправленное
        run: |
          cd env
          sed -i 's#\.\./before/#../after/#g' .wp-env.json
          ../after/node_modules/.bin/wp-env start --update
          # Admin in the site's language: core translations (wp-env start --update resets them) and the probe user's locale.
          ../after/node_modules/.bin/wp-env run cli sh -c 'l=$(wp option get WPLANG 2>/dev/null); l=${l:-ru_RU}; wp language core install "$l" --quiet; wp user update probe --locale="$l" --quiet' || true
          ../after/node_modules/.bin/wp-env run cli sh -c 'rm -rf wp-content/cache/memorial; wp eval "wp_set_current_user( (int) ( get_users( array( \"role\" => \"administrator\", \"number\" => 1, \"fields\" => \"ID\" ) )[0] ?? 1 ) ); do_action(\"admin_init\");" || true'

      - name: Снимки — исправленное
        run: cd after && PHASE=block PAGES_FILE=$GITHUB_WORKSPACE/pages.json PROBE_DIR=$GITHUB_WORKSPACE/probe npx playwright test --config tests/probe/probe.config.js --grep "$PROBE_GREP" || true

      - name: В ветку ci-probe
        if: always()
        run: |
          cd env && ../after/node_modules/.bin/wp-env run cli sh -c 'cat wp-content/debug.log 2>/dev/null || true' > ../probe/debug.log || true
          cd ../probe
          rm -rf results */results
          git init -q -b ci-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Проверка на копии сайта (прогон ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-probe
