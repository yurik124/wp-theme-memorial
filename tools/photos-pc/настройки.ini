; Настройки обработки фото «Мемориала». 1 — включено, 0 — выключено.
; Поменяли — запустите «1 Предпросмотр», посмотрите, затем «2 Обработать».
; Это те же настройки, что на экране «Мемориал → Обработка фото» на сайте.

[Обработка]
; 0 — выключить всё сразу
включено = 1

[Папки]
; Подпапки внутри «Фото»: товар или работа; «фон» — заменить фон на единый.
Венки = товар, фон
Корзины = товар, фон
Гробы = товар, фон
Кресты = товар, фон
Оградки = товар, фон
Памятники = товар
Работы = работа
; всё, что лежит в других папках
Остальное = работа

[Цвет]
включено = 1
автоуровни = 1
; 0…100 %
баланс_белого = 50
; от -20 до +20
яркость = 0
контраст = 5
теплота = 5
насыщенность = 0
; 0…100 %
резкость = 25

[Фон]
; только у папок с пометкой «фон»
включено = 1
; тёплый светлый — фон сайта
цвет = #fbfaf6

[Обрезка]
включено = 1
; товары: обрезать по предмету с полями вокруг
по_предмету = 1
; пропорции: 1:1, 3:4, 4:3, 3:2; пусто — как есть
товары = 3:4
работы =
; поля вокруг товара, %
поля = 6

[Логотип]
включено = 1
; белый (с мягкой тенью, виден на любом фото) или как на сайте
цвет = белый
; 1 — знак и слово «Мемориал», 0 — только знак
название = 1
; свой PNG с прозрачным фоном вместо логотипа сайта (путь к файлу); пусто — логотип сайта
свой_файл =
; ширина логотипа, % от ширины фото
ширина = 22
непрозрачность = 70
; отступ от края, %
отступ = 3
; на фото уже этого размера (px) не ставить
не_ставить_уже = 600
на_товары = 1
на_работы = 1

[Очистка]
; удалить данные камеры и место съёмки
удалять_exif = 1
; перевести цвета в sRGB (как видят браузеры)
перевод_в_srgb = 1

[Сохранение]
; как было, jpg или webp
формат = как было
качество = 86
; длинная сторона не больше, px (WordPress больше и не хранит)
наибольшая_сторона = 2560

[Отчёт]
; маленькие, тёмные, пересвеченные, размытые фото и повторы — в «Готово\отчёт.txt» и в предпросмотре
включено = 1
